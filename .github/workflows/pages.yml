# Publie la version web des apps sur GitHub Pages à chaque mise à jour du code.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Site web (GitHub Pages)

on:
  push:
    branches: [claude/home-fitness-app-v1-euxk48]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --ci
      - run: node scripts/build-pages.js "${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
